  /api/v1/applications/:
    get:
      operationId: v1_applications_list
      parameters:
        - in: query
          name: job
          schema:
            type: string
            format: uuid
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum:
              - accepted
              - rejected
              - submitted
              - under_review
              - withdrawn
          description: |-
            * `submitted` - Submitted
            * `under_review` - Under Review
            * `accepted` - Accepted
            * `rejected` - Rejected
            * `withdrawn` - Withdrawn
      tags:
        - v1
      security:
        - jwtHeaderAuth: []
        - jwtCookieAuth: []
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedApplicationList"
          description: ""
    post:
      operationId: v1_applications_create
      tags:
        - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Application"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Application"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Application"
        required: true
      security:
        - jwtHeaderAuth: []
        - jwtCookieAuth: []
        - jwtAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          description: ""
