components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job:
          type: string
          format: uuid
        job_details:
          allOf:
            - $ref: "#/components/schemas/Job"
          readOnly: true
        student_profile:
          type: object
          additionalProperties: {}
          readOnly: true
        resume_source:
          allOf:
            - $ref: "#/components/schemas/ResumeSourceEnum"
          writeOnly: true
          default: none
        resume_file:
          type: string
          format: uri
          nullable: true
          writeOnly: true
        resume_download_url:
          type: string
          nullable: true
          readOnly: true
        cover_letter:
          type: string
        status:
          allOf:
            - $ref: "#/components/schemas/StatusEnum"
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - job
        - job_details
        - resume_download_url
        - status
        - student_profile
        - submitted_at
        - updated_at
    ApprovalStatusEnum:
      enum:
        - pending
        - approved
        - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        logo:
          type: string
          format: uri
          nullable: true
          writeOnly: true
        logo_url:
          type: string
          nullable: true
          readOnly: true
        website:
          oneOf:
            - type: string
              format: uri
              maxLength: 200
            - type: string
              maxLength: 0
        description:
          type: string
        industry:
          type: string
          maxLength: 120
        location:
          type: string
          maxLength: 255
        contact_email:
          type: string
          format: email
          maxLength: 254
        approval_status:
          allOf:
            - $ref: "#/components/schemas/ApprovalStatusEnum"
          readOnly: true
        rejection_reason:
          type: string
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - approval_status
        - contact_email
        - id
        - logo_url
        - name
        - rejection_reason
        - reviewed_at
        - updated_at
    CompanyResubmitResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    CsrfResponse:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/RoleEnum"
        email_verified:
          type: boolean
          readOnly: true
        capabilities:
          type: object
          additionalProperties: {}
          readOnly: true
        profile:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
      required:
        - capabilities
        - email
        - email_verified
        - id
        - profile
        - role
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
      required:
        - service
        - status
    IndustryEnum:
      enum:
        - Computer Science
      type: string
      description: |-
        * `Computer Science` - Computer Science
    JWT:
      type: object
      description: Serializer for JWT authentication.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: "#/components/schemas/CurrentUser"
      required:
        - access
        - refresh
        - user
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        company:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          readOnly: true
        company_logo_url:
          type: string
          nullable: true
          readOnly: true
        job_type:
          $ref: "#/components/schemas/JobTypeEnum"
        industry:
          $ref: "#/components/schemas/IndustryEnum"
        description:
          type: string
        skills:
          type: array
          items:
            type: string
            maxLength: 80
        compensation_min:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        compensation_max:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        compensation:
          type: string
          readOnly: true
        resume_required:
          type: boolean
        cover_letter_required:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - company
        - company_logo_url
        - company_name
        - compensation
        - compensation_min
        - created_at
        - description
        - id
        - industry
        - job_type
        - title
        - updated_at
    JobTypeEnum:
      enum:
        - Internship
        - Part-Time
        - Full-Time
        - Remote
      type: string
      description: |-
        * `Internship` - Internship
        * `Part-Time` - Part-Time
        * `Full-Time` - Full-Time
        * `Remote` - Remote
