  /api/v1/jobs/:
    get:
      operationId: v1_jobs_list
      parameters:
        - in: query
          name: industry
          schema:
            type: string
            enum:
              - Computer Science
          description: |-
            * `Computer Science` - Computer Science
        - in: query
          name: job_type
          schema:
            type: string
            enum:
              - Full-Time
              - Internship
              - Part-Time
              - Remote
          description: |-
            * `Internship` - Internship
            * `Part-Time` - Part-Time
            * `Full-Time` - Full-Time
            * `Remote` - Remote
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
